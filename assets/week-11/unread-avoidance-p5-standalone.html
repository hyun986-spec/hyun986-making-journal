function setup() {
  pixelDensity(1);
  const canvas = createCanvas(CANVAS_WIDTH, CANVAS_HEIGHT);
  canvas.parent("sketch-holder");
  imageMode(window.CENTER);
  textFont("Arial");
  textSize(11);
  textStyle(BOLD);
  noCursor();
  particles = participants.map((participant) => new ParticipantParticle(participant));
}

function draw() {
  updateCursorStyle();
  background(OUTSIDE_COLOR);
  drawPhone();
  drawCentralAttractor();

  beginScreenClip();
  for (let particle of particles) {
    particle.update();
    particle.display();
  }
  endScreenClip();

  drawMessageCursor();
}

function updateCursorStyle() {
  if (isMouseInsideHomeButton()) {
    cursor(HAND);
    return;
  }

  noCursor();
}

function drawPhone() {
  push();
  stroke(22);
  strokeWeight(9);
  fill(8);
  rect(PHONE.x, PHONE.y, PHONE.width, PHONE.height, PHONE.radius);
  noStroke();
  fill(BACKGROUND_COLOR);
  rect(SCREEN.x, SCREEN.y, SCREEN.width, SCREEN.height, SCREEN.radius);
  fill(28);
  rect(PHONE.x + 159, PHONE.y + 11, 72, 8, 4);
  drawHomeButton();
  pop();
}

function drawHomeButton() {
  const isHovering = isMouseInsideHomeButton();

  push();
  noStroke();
  fill(isHovering ? 245 : 210);
  rectMode(CENTER);
  rect(HOME_BUTTON.x, HOME_BUTTON.y, HOME_BUTTON.width, HOME_BUTTON.height, HOME_BUTTON.radius);
  pop();
}

function beginScreenClip() {
  drawingContext.save();
  drawingContext.beginPath();
  drawingContext.roundRect(SCREEN.x, SCREEN.y, SCREEN.width, SCREEN.height, SCREEN.radius);
  drawingContext.clip();
}

function endScreenClip() {
  drawingContext.restore();
}

function drawCentralAttractor() {
  push();
  fill(BACKGROUND_COLOR);
  noStroke();
  circle(ATTRACTOR.x, ATTRACTOR.y, 108);
  pop();
}

function getRepulsionForce(unreadCount) {
  return constrain(unreadCount, 1, MAX_REPULSION_MESSAGES);
}

function isMouseInsideScreen() {
  return mouseX >= SCREEN.x && mouseX <= SCREEN.x + SCREEN.width &&
    mouseY >= SCREEN.y && mouseY <= SCREEN.y + SCREEN.height;
}

function isMouseInsideHomeButton() {
  return mouseX >= HOME_BUTTON.x - HOME_BUTTON.width / 2 &&
    mouseX <= HOME_BUTTON.x + HOME_BUTTON.width / 2 &&
    mouseY >= HOME_BUTTON.y - HOME_BUTTON.height / 2 &&
    mouseY <= HOME_BUTTON.y + HOME_BUTTON.height / 2;
}

function mousePressed() {
  if (isMouseInsideHomeButton()) {
    particles = participants.map((participant) => new ParticipantParticle(participant));
  }
}

function touchStarted() {
  if (isMouseInsideHomeButton()) {
    particles = participants.map((participant) => new ParticipantParticle(participant));
    return false;
  }
}

function getGenderColor(gender) {
  return gender === "Female" ? FEMALE_COLOR : MALE_COLOR;
}

function getIconForReason(reason) {
  const icons = {
    "No unread messages": heartMessageIcon,
    "I forgot": brainQuestionIcon,
    "I am too busy": clockIcon,
    "I do not know how to respond": questionMessageIcon,
    "I do not want to respond": xMessageIcon,
    "I am avoiding the conversation": hidingFaceIcon,
    "I usually don’t reply to group chats": ellipsisIcon,
    "All of the above": ellipsisIcon
  };

  return icons[reason] || ellipsisIcon;
}

function drawMessageCursor() {
  if (!isMouseInsideScreen()) return;

  push();
  tint(255, 255, 255, 210);
  image(cursorMessageIcon, mouseX, mouseY, CURSOR_ICON_SIZE, CURSOR_ICON_SIZE);
  noTint();
  pop();
}

class ParticipantParticle {
  constructor(participant) {
    this.participant = participant;
    this.position = createVector(
      random(SCREEN.x + 24, SCREEN.x + SCREEN.width - 24),
      random(SCREEN.y + 24, SCREEN.y + SCREEN.height - 24)
    );
    this.velocity = p5.Vector.random2D().mult(random(0.3, 1.2));
    this.acceleration = createVector(0, 0);
    this.color = getGenderColor(participant.gender);
    this.icon = getIconForReason(participant.reason);
    this.maxSpeed = participant.hasUnread ? 4.8 : 5.4;
    this.maxForce = 0.28;
  }

  update() {
    this.acceleration.mult(0);

    if (this.participant.hasUnread && this.participant.unread > 0) {
      this.applyForce(this.seek(createVector(ATTRACTOR.x, ATTRACTOR.y), 0.5));
      this.applyUnreadMouseRepulsion();
    } else {
      this.applyNoUnreadMouseAttraction();
    }

    this.applyBoundaryRecovery();
    this.velocity.add(this.acceleration);
    this.velocity.mult(0.94);
    this.velocity.limit(this.maxSpeed);
    this.position.add(this.velocity);
    this.keepInCanvas();
  }

  applyForce(force) {
    this.acceleration.add(force);
  }

  seek(target, forceMultiplier) {
    const desired = p5.Vector.sub(target, this.position);
    const distance = desired.mag();

    if (distance < 1) {
      return createVector(0, 0);
    }

    desired.setMag(this.maxSpeed);
    const steering = p5.Vector.sub(desired, this.velocity);
    steering.limit(this.maxForce);
    steering.mult(forceMultiplier);
    return steering;
  }

  applyUnreadMouseRepulsion() {
    if (!isMouseInsideScreen()) return;

    const mouse = createVector(mouseX, mouseY);
    const away = p5.Vector.sub(this.position, mouse);
    const distance = max(away.mag(), 1);

    if (distance < MOUSE_REPULSION_RADIUS) {
      const forceStrength = getRepulsionForce(this.participant.unread);
      const falloff = sq(1 - distance / MOUSE_REPULSION_RADIUS);
      away.setMag((forceStrength / 100) * 13 * falloff);
      this.applyForce(away);
    }
  }

  applyNoUnreadMouseAttraction() {
    if (isMouseInsideScreen()) {
      this.applyForce(this.seek(createVector(mouseX, mouseY), 0.24));
      return;
    }

    this.applyForce(this.seek(createVector(ATTRACTOR.x, ATTRACTOR.y), 0.05));
  }

  applyBoundaryRecovery() {
    const margin = 42;
    const recovery = createVector(0, 0);
    const left = SCREEN.x + margin;
    const right = SCREEN.x + SCREEN.width - margin;
    const top = SCREEN.y + margin;
    const bottom = SCREEN.y + SCREEN.height - margin;

    if (this.position.x < left) recovery.x = map(this.position.x, SCREEN.x, left, 0.7, 0);
    if (this.position.x > right) recovery.x = map(this.position.x, SCREEN.x + SCREEN.width, right, -0.7, 0);
    if (this.position.y < top) recovery.y = map(this.position.y, SCREEN.y, top, 0.7, 0);
    if (this.position.y > bottom) recovery.y = map(this.position.y, SCREEN.y + SCREEN.height, bottom, -0.7, 0);

    this.applyForce(recovery);
  }

  keepInCanvas() {
    const padding = 18;
    const left = SCREEN.x + padding;
    const right = SCREEN.x + SCREEN.width - padding;
    const top = SCREEN.y + padding;
    const bottom = SCREEN.y + SCREEN.height - padding;

    if (this.position.x < left || this.position.x > right) {
      this.velocity.x *= -0.45;
    }

    if (this.position.y < top || this.position.y > bottom) {
      this.velocity.y *= -0.45;
    }

    this.position.x = constrain(this.position.x, left, right);
    this.position.y = constrain(this.position.y, top, bottom);
  }

  display() {
    const labelOffset = this.getLabelOffset();

    push();
    tint(this.color);
    image(this.icon, this.position.x, this.position.y, ICON_SIZE, ICON_SIZE);
    noTint();
    pop();

    this.drawUnreadCount(labelOffset);
  }

  getLabelOffset() {
    const xOffset = this.position.x > SCREEN.x + SCREEN.width - 72 ? -34 : 20;
    const yOffset = this.position.y < SCREEN.y + 24 ? 18 : -14;
    return createVector(xOffset, yOffset);
  }

  drawUnreadCount(offset) {
    const label = String(this.participant.unread);
    const x = constrain(
      this.position.x + offset.x,
      SCREEN.x + 8,
      SCREEN.x + SCREEN.width - textWidth(label) - 8
    );
    const y = constrain(this.position.y + offset.y, SCREEN.y + 14, SCREEN.y + SCREEN.height - 8);

    push();
    stroke(BACKGROUND_COLOR);
    strokeWeight(4);
    fill(this.color);
    textAlign(LEFT, window.CENTER);
    text(label, x, y);
    pop();
  }
}
